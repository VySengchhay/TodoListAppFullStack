spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: todo-auth-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/todoauth}
    username: ${DB_USERNAME:todoauth}
    password: ${DB_PASSWORD:todoauth}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # Real SMTP (e.g. Gmail) needs both; a local catcher like Mailpit needs neither.
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-change-this-dev-secret}
    access-token-expiry-minutes: ${JWT_ACCESS_EXPIRY_MIN:15}
    refresh-token-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:30}
  otp:
    expiry-minutes: ${OTP_EXPIRY_MIN:10}
    max-verify-attempts: ${OTP_MAX_ATTEMPTS:5}
    max-requests-per-hour: ${OTP_MAX_REQUESTS_PER_HOUR:5}
  mail:
    from: ${MAIL_FROM:no-reply@todoauth.local}
    # When true, OTP emails are logged to console instead of sent via SMTP.
    # Useful for local/dev/docker runs without real mail credentials.
    console-mode: ${MAIL_CONSOLE_MODE:true}

logging:
  level:
    com.todoauth: DEBUG
